<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังภาพกิจกรรม - ศูนย์การศึกษาพิเศษ เขตการศึกษา 3 จังหวัดสงขลา</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
          <span>📸</span> คลังภาพกิจกรรม
        </h1>
        <p class="text-xs text-slate-500">ศูนย์การศึกษาพิเศษ เขตการศึกษา 3 จังหวัดสงขลา</p>
      </div>

      <div class="flex items-center gap-2">
        <label for="monthFilter" class="text-xs font-semibold text-slate-600">เลือกช่วงเวลา:</label>
        <select id="monthFilter" class="border border-slate-300 rounded-xl px-3 py-1.5 text-sm bg-white focus:ring-2 focus:ring-blue-600 outline-none">
          <option value="all">แสดงทั้งหมดทุกเดือน</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="loading" class="text-center py-24 text-slate-500">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent mb-3"></div>
      <p class="font-medium text-sm">กำลังเชื่อมต่อข้อมูลจาก Google Drive...</p>
    </div>

    <div id="gallery-container" class="space-y-12"></div>
  </main>

  <script>
    // วาง Web App URL ที่ได้จากการ Deploy Apps Script ล่าสุดที่นี่
    const API_URL = "https://script.google.com/macros/s/AKfycbyzycXQwFzQdPKVXpP7Gh7ntzzsOpRMMKthjrTbkTCeE0XYOIRVWAHivALO3xY3dup8/exec";

    let galleryData = [];

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        galleryData = data;
        document.getElementById('loading').classList.add('hidden');
        buildFilterOptions();
        renderGallery(galleryData);
      } catch (err) {
        document.getElementById('loading').innerHTML = `
          <div class="p-6 bg-red-50 rounded-2xl max-w-md mx-auto border border-red-200 text-red-600 text-sm">
            <p class="font-bold mb-1">ไม่สามารถดึงรูปภาพได้</p>
            <p class="text-xs text-red-500 mb-3">โปรดตรวจสอบว่าเปิดสิทธิ์โฟลเดอร์ใน Google Drive เป็น "ทุกคนที่มีลิงก์" หรือยัง</p>
            <p class="text-[11px] font-mono bg-white p-2 rounded border border-red-100">${err.message}</p>
          </div>
        `;
      }
    }

    function buildFilterOptions() {
      const select = document.getElementById('monthFilter');
      galleryData.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.month;
        opt.textContent = `เดือน ${item.month}`;
        select.appendChild(opt);
      });

      select.addEventListener('change', (e) => {
        const val = e.target.value;
        if (val === 'all') {
          renderGallery(galleryData);
        } else {
          renderGallery(galleryData.filter(d => d.month === val));
        }
      });
    }

    function renderGallery(dataset) {
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      if (!dataset || dataset.length === 0) {
        container.innerHTML = '<p class="text-center py-12 text-slate-400">ยังไม่มีข้อมูลรูปภาพในระบบ</p>';
        return;
      }

      dataset.forEach(monthItem => {
        const monthSection = document.createElement('section');
        monthSection.className = 'space-y-6';

        // หัวข้อเดือน
        const monthHeader = document.createElement('div');
        monthHeader.className = 'flex items-center gap-3 border-b border-slate-200 pb-2';
        monthHeader.innerHTML = `
          <span class="p-2 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold">📅</span>
          <h2 class="text-xl font-bold text-slate-800">ประจำเดือน ${monthItem.month}</h2>
        `;
        monthSection.appendChild(monthHeader);

        // แต่ละกิจกรรมในเดือนนั้น
        monthItem.events.forEach(event => {
          const eventCard = document.createElement('div');
          eventCard.className = 'bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-4';

          const titleBox = document.createElement('div');
          titleBox.className = 'flex items-center justify-between';
          titleBox.innerHTML = `
            <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
              ${event.name}
            </h3>
            <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">
              ${event.photos.length} รูปภาพ
            </span>
          `;
          eventCard.appendChild(titleBox);

          // Grid แสดงรูปภาพ
          const grid = document.createElement('div');
          grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4';

          event.photos.forEach(photo => {
            const card = document.createElement('div');
            card.className = 'group relative rounded-xl overflow-hidden bg-slate-100 border border-slate-200 flex flex-col';

            card.innerHTML = `
              <div class="aspect-square w-full overflow-hidden relative">
                <img 
                  src="${photo.thumbnailUrl}" 
                  alt="${photo.name}" 
                  loading="lazy"
                  referrerpolicy="no-referrer"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                  onerror="this.onerror=null; this.src='https://placehold.co/400x400?text=กำลังโหลด...';"
                />
              </div>
              <div class="p-2 bg-white flex items-center justify-between gap-1 border-t border-slate-100">
                <span class="text-[11px] text-slate-500 truncate flex-1" title="${photo.name}">${photo.name}</span>
                <a 
                  href="${photo.downloadUrl}" 
                  download="${photo.name}"
                  target="_blank"
                  class="p-1.5 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                  title="ดาวน์โหลดรูปภาพนี้"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                </a>
              </div>
            `;
            grid.appendChild(card);
          });

          eventCard.appendChild(grid);
          monthSection.appendChild(eventCard);
        });

        container.appendChild(monthSection);
      });
    }

    loadData();
  </script>
</body>
</html>
