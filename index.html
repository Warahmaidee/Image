<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังภาพกิจกรรม</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <h1 class="text-xl font-bold text-slate-900">📸 ระบบจัดเก็บและแสดงภาพกิจกรรม</h1>
      <div id="filter-container" class="flex gap-2">
        <select id="monthFilter" class="border rounded-lg px-3 py-1.5 text-sm bg-white focus:ring-2 focus:ring-blue-500">
          <option value="all">ทุกช่วงเดือน</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="loading" class="text-center py-16 text-slate-500">
      <p class="animate-pulse">กำลังโหลดรูปภาพจากระบบ Google Drive...</p>
    </div>
    
    <div id="gallery-container" class="space-y-12"></div>
  </main>

  <script>
    // แทนที่ด้วย Web App URL ที่ได้จากขั้นตอน Deploy Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbwSGEa2V8RzQUXFzDhqWwF7j56yv4Af6pd01Uaq2ArSnM-n61bMdNgHga3l8yf4nF5p/exec";

    let galleryData = [];

    async function fetchPhotos() {
      try {
        const res = await fetch(API_URL);
        galleryData = await res.json();
        document.getElementById('loading').classList.add('hidden');
        populateMonthFilter();
        renderGallery(galleryData);
      } catch (err) {
        document.getElementById('loading').innerHTML = '<span class="text-red-500">โหลดข้อมูลไม่สำเร็จ โปรดตรวจสอบสิทธิ์การแชร์โฟลเดอร์</span>';
      }
    }

    function populateMonthFilter() {
      const select = document.getElementById('monthFilter');
      galleryData.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.month;
        opt.textContent = `เดือน ${item.month}`;
        select.appendChild(opt);
      });

      select.addEventListener('change', (e) => {
        const val = e.target.value;
        if (val === 'all') {
          renderGallery(galleryData);
        } else {
          renderGallery(galleryData.filter(d => d.month === val));
        }
      });
    }

    function renderGallery(data) {
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400">ไม่พบกิจกรรมในช่วงเวลานี้</p>';
        return;
      }

      data.forEach(monthGroup => {
        const monthSection = document.createElement('section');
        monthSection.className = 'border-l-4 border-blue-600 pl-4 space-y-6';

        const monthHeading = document.createElement('h2');
        monthHeading.className = 'text-2xl font-bold text-slate-900';
        monthHeading.textContent = `📅 ประจำเดือน ${monthGroup.month}`;
        monthSection.appendChild(monthHeading);

        monthGroup.events.forEach(event => {
          const eventBox = document.createElement('div');
          eventBox.className = 'bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4';

          const title = document.createElement('h3');
          title.className = 'text-lg font-semibold text-slate-800';
          title.textContent = `📌 ${event.name} (${event.photos.length} รูป)`;
          eventBox.appendChild(title);

          const photoGrid = document.createElement('div');
          photoGrid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3';

          event.photos.forEach(photo => {
            const link = document.createElement('a');
            link.href = photo.fullUrl;
            link.target = '_blank';
            link.className = 'block aspect-square overflow-hidden rounded-xl bg-slate-100 group relative';

            const img = document.createElement('img');
            img.src = photo.thumbnailUrl;
            img.loading = 'lazy';
            img.alt = photo.name;
            img.className = 'w-full h-full object-cover transition-transform duration-300 group-hover:scale-105';

            link.appendChild(img);
            photoGrid.appendChild(link);
          });

          eventBox.appendChild(photoGrid);
          monthSection.appendChild(eventBox);
        });

        container.appendChild(monthSection);
      });
    }

    fetchPhotos();
  </script>
</body>
</html>
